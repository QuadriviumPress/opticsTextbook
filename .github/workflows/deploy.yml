name: MyST Deploy with Exports

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'scripts/**'
      - 'myst.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'pwa/**'
      - 'icons/**'
      - 'img/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'content/**'
      - 'scripts/**'
      - 'myst.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'pwa/**'
      - 'icons/**'
      - 'img/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  BASE_URL: /${{ github.event.repository.name }}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Record build start time
        run: |
          echo "BUILD_START_TIME=$(date +%s)" >> $GITHUB_ENV
          echo "STEP_START_TIME=$(date +%s)" >> $GITHUB_ENV
          echo "# 📊 Build Performance Metrics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Build started at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Record checkout time
        run: |
          STEP_END_TIME=$(date +%s)
          DURATION=$((STEP_END_TIME - STEP_START_TIME))
          echo "CHECKOUT_TIME=$DURATION" >> $GITHUB_ENV
          echo "STEP_START_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: Setup Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Record setup time
        run: |
          STEP_END_TIME=$(date +%s)
          DURATION=$((STEP_END_TIME - STEP_START_TIME))
          echo "SETUP_TIME=$DURATION" >> $GITHUB_ENV
          echo "STEP_START_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: Install npm dependencies
        run: npm ci

      - name: Record npm install time
        run: |
          STEP_END_TIME=$(date +%s)
          DURATION=$((STEP_END_TIME - STEP_START_TIME))
          echo "NPM_INSTALL_TIME=$DURATION" >> $GITHUB_ENV
          echo "STEP_START_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: Setup Typst
        uses: typst-community/setup-typst@v4
        with:
          typst-version: 'latest'

      - name: Record Typst setup time
        run: |
          STEP_END_TIME=$(date +%s)
          DURATION=$((STEP_END_TIME - STEP_START_TIME))
          echo "TYPST_SETUP_TIME=$DURATION" >> $GITHUB_ENV
          echo "STEP_START_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: Cache MyST build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ./_build
            ~/.cache/myst
          key: myst-build-${{ runner.os }}-${{ hashFiles('content/**/*.md', 'myst.yml', 'package-lock.json') }}
          restore-keys: |
            myst-build-${{ runner.os }}-
            myst-build-

      - name: Cache Typst packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/typst
          key: typst-packages-${{ runner.os }}-${{ hashFiles('_templates/typst/**/*') }}
          restore-keys: |
            typst-packages-${{ runner.os }}-

      - name: Build PDF and DOCX exports in parallel
        run: |
          echo "Building PDF and DOCX exports in parallel"
          EXPORT_START_TIME=$(date +%s)

          # Start PDF build in background
          echo "Starting PDF build..."
          (npx myst build --pdf 2>&1 | tee /tmp/pdf-build.log; echo $? > /tmp/pdf-exit-code) &
          PDF_PID=$!

          # Start DOCX build in background
          echo "Starting DOCX build..."
          (npx myst build --docx 2>&1 | tee /tmp/docx-build.log; echo $? > /tmp/docx-exit-code) &
          DOCX_PID=$!

          # Wait for both to complete
          echo "Waiting for builds to complete..."
          wait $PDF_PID
          wait $DOCX_PID

          EXPORT_END_TIME=$(date +%s)
          EXPORT_DURATION=$((EXPORT_END_TIME - EXPORT_START_TIME))

          # Check exit codes
          PDF_EXIT=$(cat /tmp/pdf-exit-code 2>/dev/null || echo "1")
          DOCX_EXIT=$(cat /tmp/docx-exit-code 2>/dev/null || echo "1")

          echo ""
          echo "=== Build Results ==="
          echo "Total parallel build time: ${EXPORT_DURATION}s"

          if [ "$PDF_EXIT" = "0" ]; then
            echo "✅ PDF build succeeded"
          else
            echo "❌ PDF build failed (exit code: $PDF_EXIT)"
            echo "PDF build log:"
            cat /tmp/pdf-build.log
          fi

          if [ "$DOCX_EXIT" = "0" ]; then
            echo "✅ DOCX build succeeded"
          else
            echo "❌ DOCX build failed (exit code: $DOCX_EXIT)"
            echo "DOCX build log:"
            cat /tmp/docx-build.log
          fi

          # Fail if either build failed
          if [ "$PDF_EXIT" != "0" ] || [ "$DOCX_EXIT" != "0" ]; then
            exit 1
          fi
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"

      - name: Verify exports were created
        run: |
          echo "=== Verifying exports were generated ==="
          echo ""
          echo "📄 PDF Exports:"
          echo "Full textbook PDF:"
          ls -lh exports/textbook.pdf 2>/dev/null && echo "✅ Found" || echo "❌ NOT FOUND"
          echo ""
          echo "Chapter PDFs:"
          ls -lh exports/chapters/*.pdf 2>/dev/null || echo "❌ No chapter PDFs found"
          pdf_count=$(find exports -name "*.pdf" 2>/dev/null | wc -l)
          echo "Total PDF files: $pdf_count"
          echo ""
          echo "📝 DOCX Exports:"
          echo "Full textbook DOCX:"
          ls -lh exports/textbook.docx 2>/dev/null && echo "✅ Found" || echo "⚠️  Not found (expected - no combined DOCX)"
          echo ""
          echo "Chapter DOCX files:"
          ls -lh exports/chapters/*.docx 2>/dev/null || echo "❌ No chapter DOCX found"
          docx_count=$(find exports -name "*.docx" 2>/dev/null | wc -l)
          echo "Total DOCX files: $docx_count"

      - name: Record export build time
        run: |
          STEP_END_TIME=$(date +%s)
          DURATION=$((STEP_END_TIME - STEP_START_TIME))
          echo "EXPORT_BUILD_TIME=$DURATION" >> $GITHUB_ENV
          echo "STEP_START_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: Build other exports (MD, JATS, etc.)
        run: |
          echo "Building any remaining export formats"
          # Build all exports that aren't PDF or DOCX (e.g., MD, JATS, TEX)
          # This is a catch-all for any other configured exports
          npx myst build --md 2>/dev/null || echo "No MD exports configured"
          npx myst build --jats 2>/dev/null || echo "No JATS exports configured"
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"

      - name: Record other exports build time
        run: |
          STEP_END_TIME=$(date +%s)
          DURATION=$((STEP_END_TIME - STEP_START_TIME))
          echo "OTHER_BUILD_TIME=$DURATION" >> $GITHUB_ENV
          echo "STEP_START_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: Generate PWA Icons
        run: |
          echo "Generating PWA icons"
          npm run generate-icons

      - name: Record icon generation time
        run: |
          STEP_END_TIME=$(date +%s)
          DURATION=$((STEP_END_TIME - STEP_START_TIME))
          echo "ICON_GEN_TIME=$DURATION" >> $GITHUB_ENV
          echo "STEP_START_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: Build HTML Assets
        run: |
          echo "Building site with BASE_URL: $BASE_URL"
          npx myst build --html
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"

      - name: Record HTML build time
        run: |
          STEP_END_TIME=$(date +%s)
          DURATION=$((STEP_END_TIME - STEP_START_TIME))
          echo "HTML_BUILD_TIME=$DURATION" >> $GITHUB_ENV
          echo "STEP_START_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: Inject custom scripts
        run: |
          echo "Injecting custom JavaScript into HTML files"
          npm run inject-scripts

      - name: Record script injection time
        run: |
          STEP_END_TIME=$(date +%s)
          DURATION=$((STEP_END_TIME - STEP_START_TIME))
          echo "SCRIPT_INJECT_TIME=$DURATION" >> $GITHUB_ENV
          echo "STEP_START_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: Setup PWA
        run: |
          echo "Setting up PWA (service worker, manifest, icons)"
          npm run setup-pwa

      - name: Record PWA setup time
        run: |
          STEP_END_TIME=$(date +%s)
          DURATION=$((STEP_END_TIME - STEP_START_TIME))
          echo "PWA_SETUP_TIME=$DURATION" >> $GITHUB_ENV
          echo "STEP_START_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: Copy PDFs and DOCX files to _build/html for download access
        run: |
          mkdir -p _build/html/exports
          mkdir -p _build/html/exports/chapters

          # Copy full textbook PDF
          if [ -f exports/textbook.pdf ]; then
            cp exports/textbook.pdf _build/html/exports/
            echo "✅ Full textbook PDF copied"
          else
            echo "⚠️ Full textbook PDF not found"
          fi

          # Copy full textbook DOCX
          if [ -f exports/textbook.docx ]; then
            cp exports/textbook.docx _build/html/exports/
            echo "✅ Full textbook DOCX copied"
          else
            echo "⚠️ Full textbook DOCX not found"
          fi

          # Copy chapter PDFs
          if [ -d exports/chapters ]; then
            cp exports/chapters/*.pdf _build/html/exports/chapters/ 2>/dev/null || echo "⚠️ No chapter PDFs found"
            chapter_count=$(ls -1 _build/html/exports/chapters/*.pdf 2>/dev/null | wc -l)
            if [ "$chapter_count" -gt 0 ]; then
              echo "✅ $chapter_count chapter PDFs copied"
            fi
          fi

          # Copy chapter DOCX files
          if [ -d exports/chapters ]; then
            cp exports/chapters/*.docx _build/html/exports/chapters/ 2>/dev/null || echo "⚠️ No chapter DOCX files found"
            docx_count=$(ls -1 _build/html/exports/chapters/*.docx 2>/dev/null | wc -l)
            if [ "$docx_count" -gt 0 ]; then
              echo "✅ $docx_count chapter DOCX files copied"
            fi
          fi

          # Create .nojekyll file to prevent GitHub Pages from processing files with Jekyll
          touch _build/html/.nojekyll
          echo "✅ .nojekyll file created (prevents Jekyll processing)"

      - name: Verify exports in build directory
        run: |
          echo "=== Verifying exports directory structure ==="
          echo ""
          echo "Contents of _build/html/exports:"
          ls -lh _build/html/exports/ || echo "❌ exports directory not found"
          echo ""
          echo "Contents of _build/html/exports/chapters:"
          ls -lh _build/html/exports/chapters/ || echo "❌ chapters directory not found"
          echo ""
          echo "=== Checking for symbolic links (not allowed by upload-pages-artifact) ==="
          find _build/html/exports -type l 2>/dev/null | while read link; do
            echo "⚠️  Found symbolic link: $link -> $(readlink $link)"
          done
          echo ""
          echo "=== File count summary ==="
          pdf_count=$(find _build/html/exports -name "*.pdf" 2>/dev/null | wc -l)
          docx_count=$(find _build/html/exports -name "*.docx" 2>/dev/null | wc -l)
          echo "Total PDF files: $pdf_count"
          echo "Total DOCX files: $docx_count"
          echo ""
          echo "=== Checking for zero-byte or corrupted files ==="
          find _build/html/exports -name "*.pdf" -size 0 2>/dev/null | while read file; do
            echo "⚠️  Zero-byte PDF: $file"
          done
          find _build/html/exports -name "*.docx" -size 0 2>/dev/null | while read file; do
            echo "⚠️  Zero-byte DOCX: $file"
          done

      - name: Record file copy time
        run: |
          STEP_END_TIME=$(date +%s)
          DURATION=$((STEP_END_TIME - STEP_START_TIME))
          echo "FILE_COPY_TIME=$DURATION" >> $GITHUB_ENV
          echo "STEP_START_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: Upload artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_build/html'

      - name: Record upload time
        run: |
          STEP_END_TIME=$(date +%s)
          DURATION=$((STEP_END_TIME - STEP_START_TIME))
          echo "UPLOAD_TIME=$DURATION" >> $GITHUB_ENV
          echo "STEP_START_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: Deploy to GitHub Pages
        id: deployment
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/deploy-pages@v4

      - name: Record deployment time
        run: |
          STEP_END_TIME=$(date +%s)
          DURATION=$((STEP_END_TIME - STEP_START_TIME))
          echo "DEPLOY_TIME=$DURATION" >> $GITHUB_ENV

      - name: Build performance summary
        if: always()
        run: |
          BUILD_END_TIME=$(date +%s)
          TOTAL_TIME=$((BUILD_END_TIME - BUILD_START_TIME))

          # Convert seconds to minutes:seconds format
          format_time() {
            local seconds=$1
            local minutes=$((seconds / 60))
            local remaining_seconds=$((seconds % 60))
            printf "%dm %02ds" $minutes $remaining_seconds
          }

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## ⏱️ Build Time Breakdown" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Duration | Percentage |" >> $GITHUB_STEP_SUMMARY
          echo "|------|----------|------------|" >> $GITHUB_STEP_SUMMARY

          # Function to add row with percentage
          add_row() {
            local name=$1
            local time=$2
            local formatted=$(format_time $time)
            local percentage=$((time * 100 / TOTAL_TIME))
            echo "| $name | $formatted | ${percentage}% |" >> $GITHUB_STEP_SUMMARY
          }

          add_row "Checkout repository" ${CHECKOUT_TIME:-0}
          add_row "Setup (Pages + Node.js)" ${SETUP_TIME:-0}
          add_row "npm install" ${NPM_INSTALL_TIME:-0}
          add_row "Setup Typst" ${TYPST_SETUP_TIME:-0}
          add_row "Build PDF + DOCX (parallel)" ${EXPORT_BUILD_TIME:-0}
          add_row "Build other exports (MD/JATS)" ${OTHER_BUILD_TIME:-0}
          add_row "Generate PWA icons" ${ICON_GEN_TIME:-0}
          add_row "Build HTML site" ${HTML_BUILD_TIME:-0}
          add_row "Inject custom scripts" ${SCRIPT_INJECT_TIME:-0}
          add_row "Setup PWA" ${PWA_SETUP_TIME:-0}
          add_row "Copy export files" ${FILE_COPY_TIME:-0}
          add_row "Upload artifact" ${UPLOAD_TIME:-0}
          add_row "Deploy to Pages" ${DEPLOY_TIME:-0}

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🎯 Total Build Time: $(format_time $TOTAL_TIME)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Build completed at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Add performance indicators
          echo "## 📈 Performance Indicators" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check if build is faster or slower than timeout
          TIMEOUT_SECONDS=$((20 * 60))
          USAGE_PERCENTAGE=$((TOTAL_TIME * 100 / TIMEOUT_SECONDS))

          if [ $USAGE_PERCENTAGE -lt 50 ]; then
            echo "✅ **Excellent**: Build time is ${USAGE_PERCENTAGE}% of timeout limit" >> $GITHUB_STEP_SUMMARY
          elif [ $USAGE_PERCENTAGE -lt 75 ]; then
            echo "✓ **Good**: Build time is ${USAGE_PERCENTAGE}% of timeout limit" >> $GITHUB_STEP_SUMMARY
          elif [ $USAGE_PERCENTAGE -lt 90 ]; then
            echo "⚠️ **Warning**: Build time is ${USAGE_PERCENTAGE}% of timeout limit" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Critical**: Build time is ${USAGE_PERCENTAGE}% of timeout limit" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Top 3 slowest steps:**" >> $GITHUB_STEP_SUMMARY

          # Create sorted list of times (simple approach)
          {
            echo "${EXPORT_BUILD_TIME:-0} Build PDF + DOCX (parallel)"
            echo "${OTHER_BUILD_TIME:-0} Build other exports (MD/JATS)"
            echo "${HTML_BUILD_TIME:-0} Build HTML site"
            echo "${NPM_INSTALL_TIME:-0} npm install"
            echo "${TYPST_SETUP_TIME:-0} Setup Typst"
            echo "${UPLOAD_TIME:-0} Upload artifact"
            echo "${DEPLOY_TIME:-0} Deploy to Pages"
            echo "${PWA_SETUP_TIME:-0} Setup PWA"
          } | sort -rn | head -3 | while read time name; do
            if [ $time -gt 0 ]; then
              echo "- $name: $(format_time $time)" >> $GITHUB_STEP_SUMMARY
            fi
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Add deployment info based on context
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "📋 **PR Build**: Validation only (no deployment)" >> $GITHUB_STEP_SUMMARY
          else
            echo "🚀 Successfully deployed to https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}" >> $GITHUB_STEP_SUMMARY
          fi
