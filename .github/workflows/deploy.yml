# Deploy the MyST HTML site (with Typst exports + PWA) via Bindery.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

jobs:
  deploy:
    uses: QuadriviumPress/bindery/.github/workflows/deploy.yml@main
    with:
      setup-typst: true
      timeout-minutes: 45
      node-options: --max-old-space-size=8192
      pre-build-command: npm run verify
      build-command: bash scripts/deploy-site.sh
      output-dir: _build/html
